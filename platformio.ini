[platformio]
default_envs = mainV2_WiFi

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:mainV1]
build_src_filter =
    +<mainV1/>
    +<mainV1/*>

[env:mainV2_WiFi]
build_src_filter =
    +<mainV2_WiFi/>
    +<mainV2_WiFi/*>

[env:ACTUATOR_TEST]
build_src_filter =
    +<ACTUATOR_TEST/>
    +<ACTUATOR_TEST/*>

[env:PRESSURE_SENSOR]
build_src_filter =
    +<PRESSURE_SENSOR/>
    +<PRESSURE_SENSOR/*>
